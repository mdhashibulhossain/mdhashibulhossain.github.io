<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title and page.title != "" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo title=false %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body class="track-{{ page.track | default: 'none' }}">
  <a class="skip" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% if page.github %}<script src="{{ '/assets/js/github.js' | relative_url }}" defer></script>{% endif %}
  {% if page.orcid and site.data.profile.links.orcid != "" %}<script src="{{ '/assets/js/orcid.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
