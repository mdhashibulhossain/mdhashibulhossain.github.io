# One entry per project. Each project belongs to ONE problem page and can use
# several disciplines.
#
#   problem:      soil-water | plant-disease | forests-carbon | cities-wildlife
#   disciplines:  mycology | pathology | physiology | ecology | rsgis
#   finding:      the result in one line (shown as the headline). Leave it out and
#                 the title is used instead.
#   title:        the topic (shown as a small label above the finding)
#
# To add a project: copy a block, change the fields, commit. No HTML needed.
# Projects appear on their problem page in the order they are listed here.
# Photos: upload assets/photos/<id>.jpg and it appears in that project (see /photos.html).
#
# Other fields: id, period, status (ongoing|complete|planned|""), context, summary,
#               methods (tags), highlights (bullets), image, image_alt, repo, links

# ══ 01 · Contaminated soil and water ═══════════════════════════════════
- id: landfill-isolates
  problem: soil-water
  disciplines: [mycology, ecology, rsgis]
  finding: "Seven landfill fungi stay viable at 500 mg/L chromium and arsenic"
  title: "Metallo-tolerant fungi from the Lalmatia waste dump"
  period: "2024 – 2025"
  status: complete
  context: "MSc field discovery pipeline · Sylhet"
  summary: >-
    GIS-chosen sampling site, 10 field samples (7 soil, 3 water), bioavailable metals by
    ICP-OES, and isolation of 27 morphotypes by serial dilution.
  methods: [Field sampling, ICP-OES, Serial dilution, −80 °C cryostorage, Selective media, ITS PCR, Spore suspensions]
  highlights:
    - "27 morphologically distinct isolates recovered"
    - "7 isolates (DMFT1–7) viable on 500 mg/L Cr and As"
    - "ITS-based identification in progress"
    - "Factorial assays of up to 210 plates in one day (7 fungi × 2 metals × 5 concentrations × 3 replicates)"
    - "Prepared and counted spore suspensions to inoculate soil in an ongoing study of the 7 isolates"
    - "Planned safety screen: brine-shrimp lethality and seed susceptibility"
  image: /assets/img/fig-study-area.jpg
  image_alt: "Satellite map of Lalmatia waste dump with sampling points and locator maps of Sylhet"

- id: msc-thesis
  problem: soil-water
  disciplines: [mycology]
  finding: "Two fungi tested against four metals, from the plate to the soil microcosm"
  title: "Heavy-metal tolerance, bioaccumulation and bioremediation by filamentous fungi"
  period: "2024 – 2026"
  status: complete
  context: "MSc thesis · SUST · Supervisors: Dr M. M. U. Haque, Prof. R. Ahmed"
  summary: >-
    Dose–response screening of Aspergillus niger and Trichoderma asperellum against
    As(V), Cd(II), Cr(VI) and Pb(II), with enzyme profiling and removal tests in water
    and soil microcosms.
  methods: [PDA tolerance assay, ImageJ, EC50 / LL.4, CAT · SOD · GR, ICP-OES, PCA, NMDS, two-way ANOVA]
  highlights:
    - "Tolerance index and growth inhibition across 4 metals and full concentration series"
    - "Antioxidant enzyme responses summarised with PCA and NMDS"
    - "Biomass accumulation and % removal measured in water and soil microcosms"
  image: /assets/img/fig-thesis-pipeline.jpg
  image_alt: "Two-column workflow: laboratory pipeline from tolerance assays to soil bioremediation, and field discovery pipeline from GIS site selection to isolate screening"

- id: gis-mcda
  problem: soil-water
  disciplines: [rsgis]
  finding: "Six satellite sensors on one 500 m grid chose the sampling site"
  title: "Multi-sensor GIS site selection for contamination sampling"
  period: "2024 – 2025"
  status: complete
  context: "MSc thesis · ArcMap 10.8 · Google Earth Engine · R"
  summary: >-
