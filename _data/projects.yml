    - "DEM, slope, flow accumulation and water-occurrence layers"
  image: /assets/img/fig-atmos-layers.jpg
  image_alt: "Grid of nine choropleth rasters: VIIRS night lights, Landsat LST, MAIAC AOD and Sentinel-5P gases"

- id: bsc-tolerance
  problem: soil-water
  disciplines: [mycology]
  finding: "T. asperellum was the most tolerant of three fungi to lead, mercury and arsenic"
  title: "In-vitro heavy-metal tolerance of three fungi"
  period: "2022 – 2023"
  status: complete
  context: "BSc project · SUST"
  summary: >-
