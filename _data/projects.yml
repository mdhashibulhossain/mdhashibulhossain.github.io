- id: soil-enrichment
  problem: soil-water
  disciplines: [ecology, rsgis]
  finding: "Zinc, cadmium and nickel enrichment in US soils holds up; the lead signal does not"
  title: "Anthropogenic enrichment of toxic elements in US soils"
  period: "2026"
  status: complete
  context: "Reproducible study · USGS DS-801 · R"
  summary: >-
    Separates geological background from human enrichment for 7 elements at 4,857
    sites using robust element–Al regression, enrichment factors, Igeo and
    compositional PCA, with a Ti normaliser check.
  methods: [Robust regression, CLR PCA, Enrichment factor, Igeo, Sensitivity analysis]
  highlights:
    - "Zn, Cd, Ni enrichment robust to normaliser choice"
    - "Pb signal did not replicate with Ti and is reported as unconfirmed"
  image: /assets/img/code-pb-residual-map.jpg
  image_alt: "US map of Pb residuals"
  repo: soil-metal-enrichment

- id: metal-genes
  problem: soil-water
  disciplines: [ecology]
  finding: "A 4% excess of metal-resistance genes is not confirmed once sampling site is accounted for"
  title: "Metal-resistance genes and contaminated environments"
  period: "2026"
  status: complete
  context: "Reproducible comparative-genomics study · Python"
  summary: >-
    Scans 84 Pseudomonas genomes against 485 metal-resistance genes with DIAMOND and
    tests whether contaminated-site isolates carry more of them, with errors clustered
    by sampling site and by Mash-derived clade.
  methods: [DIAMOND, Mash, BacMet 2.0, Poisson GLM, Cluster-robust SE]
  highlights:
    - "Rate ratio 1.039: p = 0.030 with HC1-robust errors, 0.119 clustered by site, 0.076 by clade"
    - "Reported as not confirmed in this sample, not as no effect"
  image: /assets/img/code-mrg-gene-content.jpg
  image_alt: "Metal-resistance genes per 1,000 proteins in reference and contaminated Pseudomonas genomes"
  repo: metal-resistance-genes-environment

- id: ec50-methods
  problem: soil-water
  disciplines: [mycology]
  finding: "Richer dose designs cut EC50 error about fourfold"
  title: "Dose–response modelling done properly"
  period: "2026"
  status: complete
  context: "Reproducible methods study · R"
  summary: >-
    Validates EC50 fitting against a published result, then uses labelled synthetic
    data and 12,000 simulations to show how dose and replicate design drive EC50 precision.
  methods: [LL.4, AIC, Bootstrap CI, Simulation study]
  highlights:
    - "Reproduces published ryegrass ED50 exactly (3.058)"
    - "RMSE of log-EC50: 0.21 → 0.055 from cheapest to richest design"
  image: /assets/img/code-ec50-curves.jpg
  image_alt: "Synthetic dose–response curves"
  repo: dose-response-ec50

