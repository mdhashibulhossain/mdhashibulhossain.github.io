  title: "Climate controls on global soil respiration"
  period: "2026"
  status: complete
  context: "Reproducible study · SRDB · R"
  summary: >-
    Mixed-effects model of annual soil respiration against temperature, precipitation
    and biome across 5,980 observations from 1,247 studies, with leave-one-study-out validation.
  methods: [Linear mixed model, LRT, Apparent Q10, LOSO cross-validation]
  highlights:
    - "Biome × temperature interaction supported, but no gain in out-of-study prediction (R² ≈ 0.11)"
