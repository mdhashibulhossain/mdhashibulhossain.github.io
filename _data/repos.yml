- name: Divi
  kind: flagship
  track: geo
  title: "Dīvi: drone mapping and canopy analysis for researchers"
  display_name: "Dīvi"
  tagline: "Fly. Analyze. Decide."
  former_name: "Avispria"
  logo: /assets/img/divi-logo.png
  logo_dark: /assets/img/divi-logo-dark.png
  description: "Free, offline-first toolkit for mapping with consumer RGB drones (formerly Avispria). It plans DJI Fly missions for flat maps, 3D models of an area or of a single tree, sends them to the phone, checks the photos before processing, builds orthophotos, surface models and point clouds with WebODM, and then measures canopy height, cover, gaps and single tree crowns."
  parts:
    - title: "Plan a flight"
      text: "DJI Fly missions for flat maps, 3D areas or object scans, with terrain-aware resolution and overlap prediction"
    - title: "Send to DJI Fly"
      text: "Missions go straight to the Android phone over USB or Wi-Fi"
    - title: "Check the photos"
      text: "Overlap, blur, shutter speed, hovering repeats and sun angle, flagged before processing"
    - title: "Make maps"
      text: "Orthophoto, surface model and point cloud via WebODM, with a processing record"
    - title: "Analyse"
      text: "Canopy height model, cover, gaps, single tree crowns with dieback candidates, and land cover for forest, farm or town"
  stats:
    - value: "17.9k"
      label: "lines of Python"
    - value: "1,053"
      label: "automated tests"
    - value: "80"
      label: "test modules"
  stack: [Python 3.12, uv, Typer, NiceGUI, Shapely, pyproj, rasterio, SciPy, lxml, WebODM, pytest]
  license: AGPL-3.0
  language: Python
  status: "Early version · one test flight"
  status_note: "First test flight with a DJI Lito X1 (73 waypoints, 79 photos; maps built from 67). It was flown at sunset, so its canopy and crown results are not yet reliable; more flights are needed."
  practices: [tests, lockfile, honest, citation, disclaimer]
  links:
