      path: "#install-and-run"
    - label: "Field guides"
      path: "/tree/HEAD/docs/field"
    - label: "Canopy analysis"
      path: "/blob/HEAD/docs/field/canopy.md"

- name: dose-response-ec50
  kind: analysis
  track: micro
  title: "Estimating stress tolerance: dose–response modelling done properly"
  question: "How should EC50 and tolerance be estimated and compared across strains, and how sensitive are conclusions to model choice and replication design?"
  finding: "LL.4 reproduces the published ryegrass ED50 exactly (3.058, 95% CI 2.671–3.445). On labelled synthetic data, RMSE of log-EC50 falls from 0.21 to 0.055 across 12 designs, 1,000 simulations each."
  data: "drc ryegrass (published) + labelled SYNTHETIC 3 strains × 7 doses × 4 replicates"
  methods: [LL.3 / LL.4 / Weibull, AIC selection, Delta-method vs bootstrap CI, EDcomp ratio tests, Simulation study]
  figure: /assets/img/code-ec50-curves.jpg
  figure_alt: "Fitted dose–response curves for three synthetic strains"
  scripts: 8
  stack: [R 4.5, drc, renv, Make, R test scripts]
  license: MIT
  language: R
  practices: [validate, synthetic, decisions, tests, lockfile, make, citation]
  links:
    - label: "Methods"
      path: "/blob/HEAD/docs/methods.md"
    - label: "Decisions log"
      path: "/blob/HEAD/docs/decisions.md"

- name: soil-metal-enrichment
  kind: analysis
  track: micro
  title: "Natural background vs anthropogenic enrichment of toxic elements in US soils"
  question: "Which of Cu, Zn, Pb, Cd, As, Ni and Cr exceed the geochemical background predicted from Al (cross-checked with Ti), signalling human enrichment?"
  finding: "Zn, Cd and Ni show land-cover-linked enrichment robust to the normaliser. Pb's strongest Al-based signal (p = 6.2e-13) did not replicate with Ti (p = 0.68) and is reported as unconfirmed."
  data: "USGS DS-801, 4,857 sites, 0–5 cm horizon"
  data_doi: "10.3133/ds801"
  methods: [Robust regression (lmrob), Enrichment factor, Geoaccumulation index, CLR compositional PCA, Censored-value handling, Normaliser sensitivity]
  figure: /assets/img/code-pb-residual-map.jpg
  figure_alt: "Map of Pb residuals against Al-predicted background across US sample sites"
  scripts: 10
  stack: [R 4.5, robustbase, compositions, ggplot2, maps, renv, Make]
  license: MIT
  language: R
  practices: [prereg, sensitivity, decisions, tests, lockfile, make, citation]
  links:
    - label: "Element predictions (written first)"
      path: "/blob/HEAD/docs/element_notes.md"
