- name: climate-controls-soil-respiration
  kind: analysis
  track: geo
  title: "Climate and ecosystem controls on global soil respiration"
  question: "How much of annual soil respiration do temperature and precipitation explain, and does ecosystem type change the temperature response?"
  finding: "MAT × biome interaction is supported by LRT (p = 0.036; 0.0019 after removing 28 influential points) but does not improve prediction: exact leave-one-study-out CV over 1,247 studies (2,494 refits) gives predictive R² ≈ 0.11."
  data: "Global Soil Respiration Database: 5,980 observations, 1,247 studies"
  methods: [Linear mixed model, Likelihood-ratio tests, Apparent Q10, Cook's distance sensitivity, Study-grouped CV, Leave-one-study-out CV]
  figure: /assets/img/code-rs-temperature.jpg
  figure_alt: "Model-predicted soil respiration against mean annual temperature by biome"
  scripts: 14
  stack: [R 4.5, lme4, renv, Make]
  license: MIT
  language: R
  practices: [sensitivity, cv, decisions, tests, lockfile, make, citation]
  links:
    - label: "Methods"
      path: "/blob/HEAD/docs/methods.md"
    - label: "Data provenance"
      path: "/blob/HEAD/docs/data_provenance.md"

- name: metal-resistance-genes-environment
  kind: analysis
  track: micro
  title: "Metal-resistance genes in bacteria from contaminated vs reference environments"
  question: "Do Pseudomonas genomes from metal-contaminated sites carry more metal-resistance genes than reference genomes, and does the association survive shared ancestry and shared sampling site?"
  finding: "Contaminated genomes carry about 4% more metal-resistance genes per 1,000 proteins (rate ratio 1.039, 95% CI 0.996–1.083). Significant with HC1-robust errors (p = 0.030) but not once clustered by sampling site (p = 0.119) or clade (p = 0.076): 84 genomes cannot confirm the effect."
  data: "84 NCBI RefSeq Pseudomonas genomes (59 contaminated, 25 reference, 48 sites) × BacMet 2.0, 485 metal-resistance genes"
  methods: [DIAMOND blastp, Mash distance clades, BioSample text classification, Poisson / NB GLM, Cluster-robust SE, Manual label review]
  figure: /assets/img/code-mrg-gene-content.jpg
  figure_alt: "Metal-resistance genes per 1,000 proteins in 25 reference and 59 contaminated Pseudomonas genomes"
  scripts: 13
  stack: [Python 3.12, DIAMOND, Mash, NCBI datasets, statsmodels, pandas, Make]
  license: MIT
  language: Python
  practices: [nonindep, decisions, tests, make, citation]
  links:
    - label: "Methods"
      path: "/blob/HEAD/docs/methods.md"
    - label: "Decisions log"
      path: "/blob/HEAD/docs/decisions.md"

