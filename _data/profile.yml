tagline: "I study how ecosystems respond to environmental stress, from fungi and plants at the lab bench to vegetation and land cover mapped by drones and satellites."

bio: >-
  I am an early-career researcher working where plant and fungal biology meet
  analytical chemistry and geospatial machine learning. My MSc (With Distinction,
  SUST) combined fungal metal-tolerance assays, ICP-OES, antioxidant enzyme
  profiling and a GIS multi-criteria workflow on Sentinel, Landsat and VIIRS data
  to choose where to sample metal-tolerant fungi. At CredoSense I now build models
  that detect pathogenic fungi from microscopic spore images while running
  ICP-OES nutrient and pigment analysis in the lab, and I am building Dīvi
  (formerly Avispria), an open-source toolkit for mapping canopy and vegetation with
  consumer drones.

seeking: "PhD positions and research roles in environmental microbiology, plant pathology and plant–soil ecology, and in drone, satellite and computer-vision methods for vegetation and ecosystems, and fungal–plant–animal interactions in tropical forest restoration."

