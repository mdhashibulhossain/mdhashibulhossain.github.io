# This file only holds the optional caption and description for each photo.
#   caption: shown under the photo (leave "" for no caption)
#   alt:     one short sentence describing the photo for screen readers
#   idea:    what would work well here (only shown on /photos.html)
#
# Project photos use the project id as the name (e.g. agarwood.jpg, agarwood-2.jpg).
# Add a caption for one by adding a block with that name below.

