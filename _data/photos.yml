# Photo slots. You do NOT need to edit this file to add a photo.
#
# To add a photo: upload it to  assets/photos/  with the slot name as its file name,
# for example  assets/photos/soil-water.jpg . It then appears on the site by itself.
# Open /photos.html on your site to see every slot and which ones are still empty.
