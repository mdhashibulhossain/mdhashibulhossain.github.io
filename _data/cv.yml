# Structured CV. Feeds the CV page and the home-page timeline.

profile: >-
  Forestry-trained environmental scientist working on how ecosystems respond to
  environmental stress through two complementary paths. In the wet lab I study
  fungal heavy-metal tolerance and bioremediation, plant pigments and nutrition,
  and plant pathogens, using culture assays, antioxidant enzyme profiling and
  ICP-OES. In the dry lab I use satellite remote sensing, drone photogrammetry and
  computer vision to map vegetation, land cover and contamination risk, and I write
  reproducible R and Python analyses. MSc (Thesis) in Forestry With Distinction;
  currently Junior Research Scientist at CredoSense, Dhaka. Seeking a PhD that
  links lab-measured mechanisms with landscape-scale environmental and ecological
  questions.

