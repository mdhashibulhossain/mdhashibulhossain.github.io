{%- comment -%} Small line illustrations for research interests. Expects `i.id`. Colours come from CSS tokens. {%- endcomment -%}

{% case i.id %}

  <path class="i-soil" d="M8 72 H112 C108 92 92 108 60 112 C28 108 12 92 8 72 Z"/>
  <path class="i-micro i-fill" d="M30 50 C30 30 44 20 60 20 C76 20 90 30 90 50 Z"/>
  <path class="i-micro i-thin" d="M38 50 H82"/>
  <path class="i-micro" d="M54 50 C54 60 53 66 51 72 H69 C67 66 66 60 66 50"/>
  <circle class="i-cap-spot" cx="47" cy="34" r="3"/><circle class="i-cap-spot" cx="62" cy="28" r="3.5"/><circle class="i-cap-spot" cx="75" cy="38" r="2.6"/>
  <path class="i-micro i-thin" d="M51 72 C42 76 34 74 24 82 M55 72 C52 82 44 88 38 98 M65 72 C68 82 76 88 82 98 M69 72 C78 76 86 74 96 82"/>
  <rect class="i-metal" x="22" y="86" width="6" height="6"/><rect class="i-metal" x="44" y="96" width="6" height="6"/>
  <rect class="i-metal" x="80" y="90" width="6" height="6"/><rect class="i-metal" x="96" y="78" width="6" height="6"/>

{% when "pathology" %}
  <path class="i-micro i-fill" d="M20 90 C20 50 50 22 98 20 C98 66 72 96 20 90 Z"/>
  <path class="i-micro" d="M20 90 L82 34"/>
  <circle class="i-spot" cx="56" cy="56" r="5"/><circle class="i-spot" cx="70" cy="66" r="4"/><circle class="i-spot" cx="44" cy="72" r="3.5"/>

{% when "physiology" %}
  <path class="i-micro i-fill" d="M28 96 C24 60 44 30 80 22 C88 58 70 90 28 96 Z"/>
  <path class="i-micro" d="M28 96 C44 74 58 54 76 30 M44 74 L36 60 M52 62 L66 64 M60 50 L54 40"/>
  <path class="i-bridge" d="M90 58 L90 84 C90 96 104 96 104 84 L104 58 Z"/>

{% when "mycorrhiza" %}
  <path class="i-soil" d="M6 46 H114 V114 H6 Z"/>
  <path class="i-micro" d="M60 6 V46"/>
  <path class="i-bridge" d="M60 46 V104 M60 62 C48 70 38 76 26 92 M60 70 C74 78 84 84 94 100 M60 86 C54 92 50 98 46 108"/>
  <path class="i-micro i-thin" d="M26 92 C20 86 14 88 10 80 M26 92 C30 100 22 104 18 110 M94 100 C100 94 108 98 112 90 M94 100 C96 106 104 108 106 114 M46 108 C40 104 36 108 32 104"/>
  <text x="88" y="30" class="i-text">C</text>
{% when "geocv" %}
  {% for r in (0..3) %}{% for c in (0..3) %}<rect class="i-cell i-op{{ r | plus: c | modulo: 4 }}" x="{{ c | times: 24 | plus: 12 }}" y="{{ r | times: 24 | plus: 12 }}" width="24" height="24"/>{% endfor %}{% endfor %}
  <rect class="i-box" x="54" y="30" width="44" height="40"/>
  <text x="76" y="26" class="i-text i-geo-text">site 1</text>
{% when "urban" %}
  <path class="i-line" d="M6 100 H114"/>
  <rect class="i-block" x="12" y="50" width="20" height="50"/><rect class="i-block" x="36" y="34" width="18" height="66"/>
  <rect class="i-block" x="88" y="44" width="22" height="56"/>
  <circle class="i-tree" cx="70" cy="72" r="14"/><path class="i-micro" d="M70 86 V100"/>
  <circle class="i-tree" cx="62" cy="88" r="7"/>
{% endcase %}
</svg>
